name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  pull_request:

# Least privilege: every job gets a read-only GITHUB_TOKEN. Only the
# `release` job escalates (contents: write) to publish the GitHub Release.
# Third-party actions are pinned to commit SHAs (the `# vN` comment is the
# tag the SHA was resolved from); Dependabot's github-actions ecosystem
# (.github/dependabot.yml) bumps them. Mutable tags could otherwise run
# arbitrary code with the release job's write token.
permissions:
  contents: read

# Serialise runs per ref. The build job computes the next release version
# from the existing tags and only the release job creates that tag, so two
# overlapping main-push runs would compute the same version and collide on
# the same tag. cancel-in-progress stays false so a run that is already
# releasing is never killed half-way (a superseded *pending* run is dropped,
# which is fine: the newer run builds a superset of its commits).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.7.0
  LINTERLY_VERSION: v0.3.3
  TEMPL_VERSION: v0.3.1020

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --cwd static --frozen-lockfile

      # go build/go vet (and therefore golangci-lint) now require
      # static/src/embed.go's `//go:embed dist img vendor` target to exist
      # (issue #59) - dist/ is `.gitignore`'d and only produced by this
      # build step, so it must run before golangci-lint.
      - name: Build frontend assets
        run: bun run --cwd static build

      - name: Install templ
        run: go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"

      - name: Generate templ
        run: templ generate

      # actions/setup-go (v6+) unconditionally exports GOTOOLCHAIN=local via
      # $GITHUB_ENV, which overrides workflow/job-level `env:` for every later
      # step; only a step-level `env:` takes precedence over it. golangci-lint
      # v2.14.0 requires go >= 1.26.0 (newer than go.mod's), so without
      # GOTOOLCHAIN=auto here `go install` fails with "requires go >= 1.26.0
      # (running go 1.25.x; GOTOOLCHAIN=local)". `golangci-lint run` itself
      # needs no override: it drives the go.mod toolchain via `go list`.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: golangci-lint run
        run: golangci-lint run

      # Reports known vulnerabilities in the Go standard library (as of the
      # toolchain go.mod pins) and in dependencies that the code actually
      # calls. Needs the generated templ/embed files above to type-check.
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: govulncheck
        run: govulncheck ./...

      # Enforces the line-count limits in CI as well; lefthook's
      # pre-commit alone is bypassable via --no-verify / web commits.
      # linterly v0.3.3 also requires go >= 1.26, so it needs the same
      # step-level GOTOOLCHAIN=auto as "Install golangci-lint" above.
      - name: Install linterly
        env:
          GOTOOLCHAIN: auto
        run: go install "github.com/ousiassllc/linterly/cmd/linterly@${LINTERLY_VERSION}"

      - name: linterly check
        run: linterly check --no-update-check

      - name: biome check
        working-directory: static
        run: bunx biome check .

      - name: typecheck
        working-directory: static
        run: bunx tsc --noEmit

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --cwd static --frozen-lockfile

      # go test needs static/src/embed.go's embedded dist/img/vendor target
      # to exist (issue #59), same as the lint job.
      - name: Build frontend assets
        run: bun run --cwd static build

      - name: Install templ
        run: go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"

      - name: Generate templ
        run: templ generate

      # -race catches data races (Scheduler / Risk Engine / Execution /
      # WebSocket are concurrent; issue #374). The race detector needs cgo,
      # which is enabled by default on ubuntu-latest (gcc preinstalled).
      - name: go test
        run: go test -race ./...

      - name: bun test
        run: bun --cwd static test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # fetch-depth: 0 (full history incl. tags) so the "Determine
      # version" step below can see every existing vX.Y.Z tag when
      # computing the next release version on a plain main push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: bun install --cwd static --frozen-lockfile

      # wails build's AssetServer.Handler (internal/router.New via
      # cmd/desktop) embeds static/src/embed.go's dist/img/vendor at compile
      # time (issue #59), so the frontend must be built - and this step
      # must run - before `wails build` below.
      - name: Build frontend assets
        run: bun run --cwd static build

      - name: Install templ
        run: go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"

      - name: Generate templ
        run: templ generate

      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install nsis
        run: sudo apt-get -y update && sudo apt-get -y install nsis

      - name: Determine version
        # internal/version.Version's zero value ("dev") is already
        # correct for feat/**-branch and PR builds. A tag push (manual
        # release) embeds the pushed tag name itself (issue #65: "タグ名
        # がそのままsemver、例: v0.1.1"). A plain push to main (i.e. every
        # merged PR) computes the *next* patch version from the latest
        # existing vX.Y.Z release tag instead - this is what the
        # `release` job below then actually publishes as a new tag+
        # GitHub Release (auto-release-on-main), so the version embedded
        # in the exe here must already match it exactly: issue #65's
        # self-updater compares internal/version.Version against the
        # latest published release tag, and embedding "dev" (or a stale
        # version) here would make every running copy think an update is
        # perpetually available.
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
            if [[ -z "$latest" ]]; then
              next="v0.1.0"
            else
              ver="${latest#v}"
              IFS='.' read -r major minor patch <<< "$ver"
              next="v${major}.${minor}.$((patch + 1))"
            fi
            echo "value=${next}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: wails build (windows/amd64, NSIS installer)
        working-directory: cmd/desktop
        # config.LoadSecretsFromDB (internal/config/secrets.go, issue #57)
        # reads the required JEV_API_KEY/KABU_API_PASSWORD from the secrets
        # DB table rather than the environment, and never fails startup on
        # an unset value - no placeholder env vars are needed here anymore
        # for Wails' bindings generator (it builds cmd/desktop with the
        # "bindings" tag and actually runs it to introspect the App bound
        # in wails.Run()).
        # -nsis generates a Setup.exe installer (via makensis, installed
        # above) instead of a plain portable .exe (issue #64). -installscope
        # user installs to the current user's AppData (no admin/UAC
        # required), which issue #64's fully unattended auto-update depends
        # on; the Wails default (-installscope machine, Program Files)
        # requires UAC elevation and would break unattended updates.
        # -ldflags embeds internal/version.Version (issue #65) - the
        # previous step's Determine version resolves it to "dev" on every
        # branch/PR build, so this is a no-op change from the pre-#65
        # unversioned build there.
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: wails build -platform windows/amd64 -nsis -installscope user -ldflags "-X github.com/ousiassllc/pitha-trador/internal/version.Version=${{ steps.version.outputs.value }} -X github.com/ousiassllc/pitha-trador/internal/version.ReleasePublicKey=${RELEASE_SIGNING_PUBLIC_KEY}"

      - name: List build output
        working-directory: cmd/desktop
        run: ls -la build/bin/

      - name: Generate checksums
        working-directory: cmd/desktop
        run: sha256sum build/bin/*-installer.exe > build/bin/checksums.txt

      # Issue #376: detached ed25519 signature of checksums.txt. The auto
      # updater embeds RELEASE_SIGNING_PUBLIC_KEY (the "wails build" step's
      # -ldflags) and refuses a release whose checksums.txt.sig does not
      # verify, so a release re-uploaded by someone holding only the
      # repository/GITHUB_TOKEN cannot re-sign its own checksums.txt. The
      # secret is only exposed on the release triggers (no fork-PR/branch
      # builds) and the step fails - rather than silently publishing an
      # unsigned release the embedded key would reject - when it is missing.
      # The signature is base64 of the raw 64-byte ed25519 signature.
      - name: Sign checksums
        if: vars.RELEASE_SIGNING_PUBLIC_KEY != '' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push'))
        working-directory: cmd/desktop
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set but RELEASE_SIGNING_PUBLIC_KEY is"
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in build/bin/checksums.txt | base64 -w0 > build/bin/checksums.txt.sig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pitha-trador-windows-amd64
          path: |
            cmd/desktop/build/bin/*-installer.exe
            cmd/desktop/build/bin/checksums.txt
            cmd/desktop/build/bin/checksums.txt.sig

  # Publishes a GitHub Release either for a manual `git push` of a
  # `vX.Y.Z` tag, or automatically for every plain push to main (i.e.
  # every merged PR) - the latter is what makes "merge to main ->
  # released" happen without a human ever running `git tag`/`git push`
  # --tags by hand. Both cases reuse the exact same build job artifact;
  # the `tag_name` input is always taken from that job's own computed
  # `version` output (rather than defaulting to `github.ref_name`, which
  # for a main push would literally be the string "main") so the tag
  # this creates always matches what the exe embedded (see "Determine
  # version" above).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pitha-trador-windows-amd64
          path: dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          files: |
            dist/*-installer.exe
            dist/checksums.txt
            dist/checksums.txt.sig
          generate_release_notes: true
          draft: false
