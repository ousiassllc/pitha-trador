version: 2
updates:
  # Third-party actions in ci.yml are pinned to commit SHAs (issue #375);
  # Dependabot rewrites the SHA and the trailing `# vN` comment on update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Frontend dependencies live in static/ (bun.lock).
  - package-ecosystem: bun
    directory: /static
    schedule:
      interval: weekly
