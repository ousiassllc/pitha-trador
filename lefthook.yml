pre-commit:
  commands:
    golangci-lint:
      glob: "*.go"
      # `make generate` (templ generate + bun run --cwd static build)
      # must run first: static/src/embed.go's `//go:embed dist img vendor`
      # (issue #59) won't even compile without it, so golangci-lint run
      # fails outright on a clean checkout otherwise.
      run: make generate && golangci-lint run
    biome:
      # bunx at repo root resolves an unrelated npm `biome@0.3.3` (issue
      # #232): @biomejs/biome is only a devDependency of static/, so run
      # from there. With `root`, lefthook passes only static/ files, as
      # paths relative to static/.
      root: static/
      glob: "**/*.{ts,css,json,mjs}"
      run: bunx biome check {staged_files}
    typecheck:
      # CI's lint job runs `tsc --noEmit`; biome alone does not catch type
      # errors (issues #197/#198). tsc checks the whole project, so no
      # {staged_files}; it needs static/node_modules (bun install).
      root: static/
      glob: "**/*.ts"
      run: bun run typecheck
    linterly:
      run: linterly check

pre-push:
  commands:
    go-test:
      # Same reasoning as pre-commit's golangci-lint above: go test
      # needs *_templ.go and static/src/dist/ regenerated first, or it
      # either fails to compile (clean checkout) or silently runs
      # against a stale build (issue #74's internal/web/style_test.go).
      run: make generate && go test ./...
