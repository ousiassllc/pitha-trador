# risk.yaml — Risk Engine制限値（Paper/Live別）。
#
# internal/config.LoadRisk が本ファイルを internal/config.RiskConfig へ
# 読み込む。項目・初期値は docs/requirements/functional.md §4.7 Risk Engine
# の表（Paper初期値／Live初期値）にそのまま対応する。
#
# 本ファイルはRisk Engineのリミット値（risk.*キー相当）であり、
# docs/architecture/overview.md §1「AI自己改善ループの境界」の方針により
# Sol/Opusの自己改善ループの対象外とする。人手のみが変更できる。

# initial_capital は「口座資産に対する%」で表す各上限
# （max_position_per_symbol_pct / max_total_exposure_pct / max_daily_loss_pct /
# max_trade_loss_pct）の分母となる想定資金（円）であり、ポジションサイズ算出
# の基準でもある（functional.md §4.7 / §4.8）。0以下は未設定扱い:
# Paperは起動時に警告してデフォルト（3,000万円）を使い、Liveは実資金額の設定が必須
# （未設定のままではRisk Engineが全新規取引をfail-closedで拒否する）。
#
# 上記以外の上限は起動時に検証し、範囲外（キーの欠落・タイプミスによる0を含む）は
# 項目名付きエラーで起動を失敗させる（functional.md §4.7 FR-RISK-1）:
#   max_position_per_symbol_pct / max_total_exposure_pct / max_daily_loss_pct /
#   max_trade_loss_pct / max_spread_bps            … 正（>0）
#   max_open_positions / max_consecutive_losses    … 1以上
#   cooldown_after_loss_minutes / force_flat_before_market_close_minutes /
#   heartbeat_timeout_minutes                      … 0以上
# paperは常に検証し、liveはliveセクションに値を1つでも書いた場合のみ検証する。

paper:
  initial_capital: 30000000
  max_position_per_symbol_pct: 2.0
  max_total_exposure_pct: 20.0
  max_daily_loss_pct: 1.0
  max_trade_loss_pct: 0.25
  max_open_positions: 5
  max_spread_bps: 30
  max_consecutive_losses: 4
  cooldown_after_loss_minutes: 5
  force_flat_before_market_close_minutes: 10
  # Paperでは対象外（dead-man's switchはLive専用、FR-RISK-6）。
  heartbeat_timeout_minutes: 0

live:
  # Live移行前に実際の運用資金（円）へ設定すること（未設定=新規取引は全拒否）。
  initial_capital: 0
  max_position_per_symbol_pct: 1.0
  max_total_exposure_pct: 10.0
  max_daily_loss_pct: 0.5
  max_trade_loss_pct: 0.15
  max_open_positions: 3
  max_spread_bps: 20
  max_consecutive_losses: 3
  cooldown_after_loss_minutes: 10
  force_flat_before_market_close_minutes: 15
  heartbeat_timeout_minutes: 120
