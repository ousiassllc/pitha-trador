# risk.yaml — Risk Engine制限値（Paper/Live別）。
#
# internal/config.LoadRisk が本ファイルを internal/config.RiskConfig へ
# 読み込む。項目・初期値は docs/requirements/functional.md §4.7 Risk Engine
# の表（Paper初期値／Live初期値）にそのまま対応する。
#
# 本ファイルはRisk Engineのリミット値（risk.*キー相当）であり、
# docs/architecture/overview.md §1「AI自己改善ループの境界」の方針により
# Sol/Opusの自己改善ループの対象外とする。人手のみが変更できる。

paper:
  max_position_per_symbol_pct: 2.0
  max_total_exposure_pct: 20.0
  max_daily_loss_pct: 1.0
  max_trade_loss_pct: 0.25
  max_open_positions: 5
  max_spread_bps: 30
  max_consecutive_losses: 4
  cooldown_after_loss_minutes: 5
  force_flat_before_market_close_minutes: 10
  # Paperでは対象外（dead-man's switchはLive専用、FR-RISK-6）。
  heartbeat_timeout_minutes: 0

live:
  max_position_per_symbol_pct: 1.0
  max_total_exposure_pct: 10.0
  max_daily_loss_pct: 0.5
  max_trade_loss_pct: 0.15
  max_open_positions: 3
  max_spread_bps: 20
  max_consecutive_losses: 3
  cooldown_after_loss_minutes: 10
  force_flat_before_market_close_minutes: 15
  heartbeat_timeout_minutes: 120
