# strategy.yaml — Scheduler周期・Fast Screenerしきい値・Jev Scoutしきい値・
# Policy Engineしきい値。
#
# internal/config.LoadStrategy が本ファイルを internal/config.StrategyConfig
# へ読み込む。項目は docs/requirements/functional.md §4.2 Fast Screener /
# §4.3 スキャン頻度・イベント駆動 / §4.4 Jev Scout / §4.6 Policy Engine の
# 初期値に対応する。
# しきい値は後続スコープ（Calibration結果に基づく調整、Sol自己改善ループ等）
# で書き換えられる想定のため、コード側にハードコードしない。
#
# fast_screener / jev_scout / policy は起動時に検証される（scan.* のような
# 既定値補完はしない）。キー欠落・範囲外（top_n < 1、jev_scout.min_* や
# policy の確率系しきい値が (0, 1] 外、min_entry_quality が
# poor/fair/good/strong/exceptional 以外、など）は項目名付きのエラーで
# 起動に失敗する。PITHA_POLICY_* / PITHA_FAST_SCREENER_* で上書きした後の値も
# 同じ検証を通る（FR-FS-4 / FR-SCOUT-2a / FR-POLICY-2a）。

scan:
  # *_seconds は正の整数で、max >= min であること。未設定/0以下は設定ローダーが
  # 下記の同梱既定値で補完し、max < min の max は min に引き上げる（0だと
  # 候補更新が待機なしで回り、フルスキャンが毎秒登録されるため）。
  # 全銘柄RESTスキャン（60秒ごとの market-data 全件投入、FR-SCHED-2）の
  # オン/オフ。既定はfalse（issue #651の方針転換・#652）。省略時もfalse。
  # falseのとき、全件投入の代わりにkabu GET /ranking（毎分）で決めた
  # PUSH登録銘柄（最大45。保有・注文中は固定枠、入れ替えは毎分最大5、
  # 入れた銘柄は最低5分保持。FR-SCHED-9）だけを取り込む。市場コンテキスト
  # 算出用の指数行も投入されなくなる。明示的にtrueにしたときだけ全件投入する。
  full_scan_enabled: false
  # 対象ユニバース全体を再スキャンする周期（秒）。functional.md §4.3。
  full_scan_interval_seconds: 60
  # 候補銘柄（Fast Screener通過銘柄）を再評価する周期（秒）の範囲。
  candidate_refresh_interval_seconds_min: 15
  candidate_refresh_interval_seconds_max: 30
  # 保有ポジション銘柄を再評価する周期（秒）の範囲。
  held_position_interval_seconds_min: 5
  held_position_interval_seconds_max: 15
  # 同一銘柄へのjev-scoutジョブを候補更新サイクルから再投入しない最小間隔（秒）。
  # 前回Scout完了からこの秒数が経つまで（および同一銘柄のpending/running
  # ジョブがある間）は投入をスキップし、候補更新周期（15〜30秒）に関わらず
  # 同一銘柄のScoutを1分あたり1回に抑える（非機能§2.1の上限N×2/分）。
  # イベント発火による即時再評価（FR-SCAN-1）はこの間隔の対象外。
  jev_scout_min_interval_seconds: 60
  # kabuステーション情報API・銘柄登録APIのプロセス全体の上限（件/秒）。
  # 公式は10件/秒（FAQ）。既定8は余裕。0以下は8に補完、10超は10に切り下げ。
  # 発注APIは呼ばない。トークン発行はこの上限の対象外。
  kabu_info_api_max_per_second: 8
  # FR-SCAN-1/FR-SCAN-2: 通常周期を待たず再評価する（しきい値以上）/
  # Jev呼び出しをスキップする（すべてしきい値未満かつイベントなし）判定の
  # しきい値。functional.md §4.3は数値の初期値を定めていないため、他の
  # しきい値と同様バックテスト後に調整する前提の初期値。
  # 判定の基準: return_1m_change_threshold は1分リターン(return_1m)の絶対値、
  # volume_ratio_change_threshold は5分出来高比率(volume_ratio_5m)の絶対値と
  # 比較する（前バーとの差ではなく現在値の水準判定。volume_ratio_5mは通常
  # 1.0前後なので2.0は「平均の2倍以上」）。spread/orderbook/trade_flowの3つは
  # 直近2バーの差の絶対値と比較する。
  # 各値は正の数であること。未設定/0以下は設定ローダーが下記の同梱既定値で
  # 補完する（0だと全バーで再評価が発火しFR-SCAN-2が無効化されるため）。
  event_trigger:
    return_1m_change_threshold: 0.005
    volume_ratio_change_threshold: 2.0
    spread_change_bps_threshold: 10
    orderbook_imbalance_change_threshold: 0.3
    # 約定フロー急変: 直近2バーのtrade_flow_imbalance(-1〜1)の差の絶対値。
    trade_flow_imbalance_change_threshold: 0.4
  # 場中 kabuステーション GET /ranking を定期取得し、件数・duration_ms・
  # CurrentPriceTime・HTTP/kabuコードだけをログに出す計測（issue #652、
  # functional.md FR-SCHED-8）。取得した価格・時価はDB保存もログ出力もしない
  # （kabu利用規約）。既定はオフ。types は種別1〜15、exchanges は
  # ALL/T/TP/TS/TG/M/FK/S。未設定は種別1〜7×T/TP/TS/TG・60秒周期で補完する。
  # include_outside_session: true で立会時間外（8:55〜9:10のデータ復帰時間
  # の計測など）も取得する。1サイクルの呼び出し数は types×exchanges 件で、
  # kabu_info_api_max_per_second の上限を共有する。
  ranking_measure:
    enabled: false
    include_outside_session: false
    interval_seconds: 60
    types: [1, 2, 3, 4, 5, 6, 7]
    exchanges: [T, TP, TS, TG]

fast_screener:
  # FR-FS-1: Jev API呼び出し前の数値フィルター。
  min_price: 100
  max_price: 500000
  min_turnover_5m_jpy: 10000000
  max_spread_bps: 50
  min_volume_ratio: 1.2
  # 5分リターン絶対値の下限。単位は**パーセント**（0.3 = 0.3%）。Feature Engineの
  # return_5mは小数比（0.003 = 0.3%）で、スクリーナーが×100して比較する。
  min_abs_return_5m_pct: 0.3
  min_realized_volatility: 0.001
  # フィルター通過銘柄のうち上位何件をJev Scoutへ送るか（FR-FS-2）。
  # 既定20はJev APIコストを抑える側の値。50〜200へ引き上げる場合は
  # 呼び出しコスト（non-functional.md §2.1）を確認すること。
  top_n: 20
  # FR-FS-2: screen_score算出に使う各要素の重み。
  weights:
    volume_ratio: 0.2
    abs_return_5m: 0.2
    breakout_strength: 0.2
    orderbook_imbalance: 0.2
    volatility_expansion: 0.2

jev_scout:
  # FR-SCOUT-2: 通過条件（初期値。バックテスト後に調整）。
  # interesting_now >= 0.65 AND liquidity_ok >= 0.70 AND abnormal_activity >= 0.55
  min_interesting_now: 0.65
  min_liquidity_ok: 0.70
  min_abnormal_activity: 0.55

policy:
  # FR-POLICY-3「キャリブレーション対象外」: Jev decision の confidence が属する
  # 信頼度バケットのラベル付き Calibration サンプル数がこの値未満なら NONE。
  # 0 で無効化。
  min_calibration_samples: 20
  # FR-POLICY-1/2: LONG/SHORTそれぞれのPolicy Engine通過しきい値。
  long:
    min_probability: 0.68
    min_entry_quality: strong
    min_continuation_probability: 0.60
    max_toxic_flow: 0.35
    max_liquidity_stressed: 0.25
  short:
    min_probability: 0.68
    min_entry_quality: strong
    min_continuation_probability: 0.60
    max_toxic_flow: 0.35
    max_liquidity_stressed: 0.25
