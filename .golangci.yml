version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - depguard
    # Security / resource-leak checks (issue #375): TLS, file permissions,
    # command execution, unclosed HTTP bodies, missing contexts and
    # unchecked *sql.Rows.Err().
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
  settings:
    depguard:
      rules:
        # docs/architecture/overview.md §3: web/ depends on service/domain only.
        web-no-repository:
          files:
            - "**/internal/web/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/repository
              desc: web layer must not import repository; use service/domain (architecture/overview.md §3)
        # docs/components/overview.md §3: Templ layers take plain props
        # (domain types allowed); handler maps service results onto them.
        templ-no-service:
          files:
            - "**/internal/web/atoms/**"
            - "**/internal/web/molecules/**"
            - "**/internal/web/organisms/**"
            - "**/internal/web/pages/**"
            - "**/internal/web/layout/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/service
              desc: Templ layers must not import service; take plain props and map them in web/handler (components/overview.md §3)
    gosec:
      excludes:
        # G304 (file path from a variable): every os.Open/ReadFile/Create
        # path here is built from the app's own config/data directories or
        # server-generated names (log day, backup name, updater download
        # dest) - none is taken from a request. File *permission* checks
        # (G301/G302/G306) stay enabled.
        - G304
  exclusions:
    generated: lax
    rules:
      # Test code: fixed permissions on t.TempDir() files, throwaway
      # http.NewRequest/net.Dial without contexts and websocket handshakes
      # in tests are not attack surface; production code is still checked.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
      # internal/config/secret*.go: G101 matches the *names* of the
      # secrets-table row keys (JEV_API_KEY, ...) and the encryption seed;
      # the values are key names / a documented non-secret seed, never
      # credentials (see secretcrypto.go).
      - path: internal/config/secret.*\.go
        text: "G101"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
