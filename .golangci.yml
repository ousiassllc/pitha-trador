version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - depguard
    # Security / resource-leak checks (issue #375): TLS, file permissions,
    # command execution, unclosed HTTP bodies, missing contexts and
    # unchecked *sql.Rows.Err().
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
  settings:
    depguard:
      rules:
        # docs/architecture/overview.md §3: web/ depends on service/domain only.
        web-no-repository:
          files:
            - "**/internal/web/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/repository
              desc: web layer must not import repository; use service/domain (architecture/overview.md §3)
        # docs/architecture/overview.md §3: bootstrap is the composition root
        # (bootstrap -> web is the only direction); web must not import it
        # (issue #702). Handler-classified errors live in domain/.
        web-no-bootstrap:
          files:
            - "**/internal/web/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/bootstrap
              desc: web layer must not import bootstrap (composition root); share types via domain/ (architecture/overview.md §3)
        # docs/components/overview.md §3: Templ layers take plain props
        # (domain types allowed); handler maps service results onto them.
        templ-no-service:
          files:
            - "**/internal/web/atoms/**"
            - "**/internal/web/molecules/**"
            - "**/internal/web/organisms/**"
            - "**/internal/web/pages/**"
            - "**/internal/web/layout/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/service
              desc: Templ layers must not import service; take plain props and map them in web/handler (components/overview.md §3)
        # docs/components/overview.md §3: Atomic Design dependencies point one
        # way (atoms -> molecules -> organisms -> layout -> pages) and only
        # layout (the assembly layer) may import web/middleware (issue #521).
        atoms-direction:
          files:
            - "**/internal/web/atoms/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/molecules
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/organisms
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/pages
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/layout
              desc: Templ layers depend downward only (components/overview.md §3)
        molecules-direction:
          files:
            - "**/internal/web/molecules/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/organisms
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/pages
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/layout
              desc: Templ layers depend downward only (components/overview.md §3)
        organisms-direction:
          files:
            - "**/internal/web/organisms/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/pages
              desc: Templ layers depend downward only (components/overview.md §3)
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/layout
              desc: Templ layers depend downward only (components/overview.md §3)
        layout-direction:
          files:
            - "**/internal/web/layout/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/pages
              desc: Templ layers depend downward only (components/overview.md §3)
        templ-parts-no-middleware:
          files:
            - "**/internal/web/atoms/**"
            - "**/internal/web/molecules/**"
            - "**/internal/web/organisms/**"
            - "**/internal/web/pages/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/web/middleware
              desc: only web/layout and web/handler may use web/middleware; take values as props (components/overview.md §3)
        # docs/architecture/overview/integrations.md §5: the broker-neutral
        # packages talk to internal/service/broker only; the kabu adapter
        # (internal/service/marketdata and everything beneath it, kabu/ and
        # kabu/pushfeed included) is wired in
        # bootstrap alone (issue #722). Tests of these packages follow the
        # same rule: they use neutral fakes.
        broker-neutral-no-adapter:
          files:
            - "**/internal/service/featureengine/**"
            - "**/internal/service/execution/**"
            - "**/internal/service/risk/**"
            - "**/internal/service/policy/**"
            - "**/internal/service/screener/**"
            - "**/internal/service/symbolcache/**"
            - "**/internal/service/broker/**"
            - "**/internal/bootstrap/rankingwatch/**"
            - "**/internal/bootstrap/marketdatajob/**"
            - "**/internal/bootstrap/heldposition/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/service/marketdata
              desc: broker-neutral packages must not import the kabu adapter; use internal/service/broker (architecture/overview/integrations.md §5)
        # The 立花 adapter (internal/service/broker/tachibana and everything
        # beneath it, issue #724) is wired in bootstrap alone as well.
        broker-neutral-no-tachibana:
          files:
            - "**/internal/service/featureengine/**"
            - "**/internal/service/execution/**"
            - "**/internal/service/risk/**"
            - "**/internal/service/policy/**"
            - "**/internal/service/screener/**"
            - "**/internal/service/symbolcache/**"
            - "**/internal/bootstrap/rankingwatch/**"
            - "**/internal/bootstrap/marketdatajob/**"
            - "**/internal/bootstrap/heldposition/**"
          deny:
            - pkg: github.com/ousiassllc/pitha-trador/internal/service/broker/tachibana
              desc: broker-neutral packages must not import the tachibana adapter; use internal/service/broker (architecture/overview/integrations.md §5)
    gosec:
      excludes:
        # G304 (file path from a variable): every os.Open/ReadFile/Create
        # path here is built from the app's own config/data directories or
        # server-generated names (log day, backup name, updater download
        # dest) - none is taken from a request. File *permission* checks
        # (G301/G302/G306) stay enabled.
        - G304
  exclusions:
    generated: lax
    rules:
      # Test code: fixed permissions on t.TempDir() files, throwaway
      # http.NewRequest/net.Dial without contexts and websocket handshakes
      # in tests are not attack surface; production code is still checked.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - bodyclose
      # internal/config/secret*.go: G101 matches the *names* of the
      # secrets-table row keys (JEV_API_KEY, ...) and the encryption seed;
      # the values are key names / a documented non-secret seed, never
      # credentials (see secretcrypto.go).
      - path: internal/config/secret.*\.go
        text: "G101"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
